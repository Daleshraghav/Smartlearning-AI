<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Formulas – Book 1 to 4 | SmartLearning AI</title>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2333; --muted:#6b7280; --accent:#4f46e5; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151f; --card:#1b2030; --text:#e8eaf2; --muted:#9aa3b5; --accent:#818cf8; --border:#2c3347; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:24px 16px 8px; max-width:1000px; margin:auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .controls { max-width:1000px; margin:auto; padding:0 16px; display:flex; flex-wrap:wrap; gap:8px; }
  .controls input { flex:1 1 220px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1rem; }
  .chip { padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; font-size:.9rem; }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .group { max-width:1000px; margin:auto; padding:0 16px; }
  .chap { margin:24px 0 8px; font-size:1.1rem; color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .card .t { font-size:.85rem; color:var(--muted); margin-bottom:8px; }
  .card .f { overflow-x:auto; padding:4px 0; }
  .tag { display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:6px; background:var(--border); color:var(--muted); margin-top:8px; }
  .empty { text-align:center; color:var(--muted); padding:40px; }
  footer { max-width:1000px; margin:32px auto; padding:0 16px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>📐 Math Formulas</h1>
  <p class="sub">Book 1 se Book 4 &middot; NCERT, RS Aggarwal &amp; AKTU</p>
</header>

<div class="controls" id="bookChips"></div>
<div class="controls" style="margin-top:8px" id="srcChips"></div>
<div class="controls" style="margin-top:8px">
  <input id="q" type="search" placeholder="Formula search karein (e.g. Laplace, Simpson, sin)...">
</div>

<div class="group" id="out"></div>
<footer>Note: AKTU ka syllabus saal aur branch ke hisaab se thoda badalta hai. Exam se pehle apne syllabus se match kar lein.</footer>

<script>
let DATA = [], book = 0, source = "", query = "";
const BOOKS = [[0,"Sab"],[1,"Book 1"],[2,"Book 2"],[3,"Book 3"],[4,"Book 4"]];
const SOURCES = [["","Sab Sources"],["NCERT / RS Aggarwal","NCERT / RS Aggarwal"],["AKTU","AKTU"]];

function chips(elId, items, getActive, onClick) {
  const el = document.getElementById(elId); el.innerHTML = "";
  items.forEach(([v, label]) => {
    const b = document.createElement("button");
    b.className = "chip" + (getActive() === v ? " active" : "");
    b.textContent = label;
    b.onclick = () => { onClick(v); render(); };
    el.appendChild(b);
  });
}

function render() {
  chips("bookChips", BOOKS, () => book, v => book = v);
  chips("srcChips", SOURCES, () => source, v => source = v);
  const q = query.toLowerCase();
  const list = DATA.filter(d =>
    (!book || d.book === book) && (!source || d.source === source) &&
    (!q || (d.title + " " + d.chapter + " " + d.latex).toLowerCase().includes(q)));
  const out = document.getElementById("out"); out.innerHTML = "";
  if (!list.length) { out.innerHTML = '<div class="empty">Koi formula nahi mila.</div>'; return; }
  const groups = {};
  list.forEach(d => { const k = d.source + " · Book " + d.book + " · " + d.chapter; (groups[k] = groups[k] || []).push(d); });
  Object.entries(groups).forEach(([k, items]) => {
    const h = document.createElement("h2"); h.className = "chap"; h.textContent = k; out.appendChild(h);
    const g = document.createElement("div"); g.className = "grid";
    items.forEach(d => {
      const c = document.createElement("div"); c.className = "card";
      c.innerHTML = '<div class="t"></div><div class="f"></div><span class="tag"></span>';
      c.querySelector(".t").textContent = d.title;
      c.querySelector(".tag").textContent = d.source;
      try { katex.render(d.latex, c.querySelector(".f"), { throwOnError: false, displayMode: true }); }
      catch (e) { c.querySelector(".f").textContent = d.latex; }
      g.appendChild(c);
    });
    out.appendChild(g);
  });
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
window.addEventListener("load", () =>
  fetch("{{ url_for('formulas_data') }}").then(r => r.json()).then(d => { DATA = d; render(); }));
</script>
</body>
</html>
