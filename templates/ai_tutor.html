<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor | SmartLearn AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0b0f19;
  --bg-sidebar: #111827;
  --card-bg: rgba(255, 255, 255, 0.04);
  --border-color: rgba(255, 255, 255, 0.08);
  --accent-purple: #8b5cf6;
  --accent-blue: #38bdf8;
  --accent-gold: #fbbf24;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Sidebar Styling */
.sidebar {
  width: 260px;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 20px;
}

.brand-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.back-btn {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  transition: all 0.2s;
}

.back-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.new-chat-btn {
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
  transition: all 0.2s;
}

.new-chat-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
}

.history-section {
  flex: 1;
  overflow-y: auto;
}

.history-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.2s;
}

.history-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
}

/* Main Chat Container */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
.chat-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.tutor-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tutor-badge {
  font-size: 11px;
  background: rgba(139, 92, 246, 0.2);
  color: var(--accent-purple);
  border: 1px solid rgba(139, 92, 246, 0.3);
  padding: 3px 8px;
  border-radius: 12px;
}

/* Chat Messages Box */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20%;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Welcome Screen Mode */
.welcome-screen {
  text-align: center;
  margin: auto;
  max-width: 600px;
}

.welcome-screen h2 {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #ffffff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome-screen p {
  color: var(--text-muted);
  font-size: 15px;
  margin-bottom: 30px;
}

.feature-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.feature-btn {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  padding: 16px;
  border-radius: 16px;
  color: var(--text-main);
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.feature-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(139, 92, 246, 0.4);
  transform: translateY(-2px);
}

.feature-btn span {
  font-size: 18px;
}

/* Message Bubbles */
.message {
  display: flex;
  gap: 14px;
  max-width: 100%;
}

.message.user {
  justify-content: flex-end;
}

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}

.avatar.ai {
  background: linear-gradient(135deg, #8b5cf6, #38bdf8);
  color: white;
}

.avatar.user {
  background: #334155;
  color: white;
}

.message-content {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.6;
  max-width: 80%;
  white-space: pre-wrap;
}

.message.user .message-content {
  background: #2e1065;
  border-color: rgba(139, 92, 246, 0.3);
}

.message-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}

.action-icon {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.2s;
}

.action-icon:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

/* Typing Indicator */
.typing {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px;
}

.dot {
  width: 8px;
  height: 8px;
  background: var(--accent-purple);
  border-radius: 50%;
  animation: blink 1.4s infinite ease-in-out both;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1.1); }
}

/* Chat Input Bar */
.input-area {
  padding: 20px 20%;
  background: var(--bg-main);
}

.input-container {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color 0.2s;
}

.input-container:focus-within {
  border-color: var(--accent-purple);
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
}

.input-container textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-main);
  font-family: inherit;
  font-size: 14.5px;
  resize: none;
  outline: none;
  max-height: 120px;
  height: 24px;
}

.send-btn {
  background: var(--accent-purple);
  color: white;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: transform 0.2s;
}

.send-btn:hover {
  transform: scale(1.05);
}

/* Responsive */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .chat-messages, .input-area { padding-left: 16px; padding-right: 16px; }
  .feature-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand-box">
      <a href="{{ url_for('dashboard') }}" class="back-btn">← Dashboard</a>
    </div>

    <button class="new-chat-btn" onclick="startNewChat()">
      <span>+</span> New Chat
    </button>

    <div class="history-section">
      <div class="history-title">Recent Chats</div>
      <div class="history-list" id="historyList">
        <div class="history-item">Quantum Physics Basics</div>
        <div class="history-item">Calculus Integration</div>
        <div class="history-item">Python Data Structures</div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="chat-header">
      <div class="tutor-title">
        ✦ SmartLearn AI Tutor
        <span class="tutor-badge">Gemini Flash 1.5</span>
      </div>
    </header>

    <!-- Chat Messages Box -->
    <div class="chat-messages" id="chatMessages">
      
      <!-- Initial Welcome Display -->
      <div class="welcome-screen" id="welcomeScreen">
        <h2>How can I help your learning today?</h2>
        <p>Ask any doubt, request a quiz, or ask for step-by-step topic explanations.</p>

        <div class="feature-cards">
          <button class="feature-btn" onclick="sendQuickPrompt('Explain the theory of Relativity in simple terms.')">
            <span>✦ Explain Concept</span>
            Theory of Relativity simply
          </button>
          <button class="feature-btn" onclick="sendQuickPrompt('Generate a 5-question Quiz on Python Loops with answers.')">
            <span>📝 Generate Quiz</span>
            5 Questions on Python Loops
          </button>
          <button class="feature-btn" onclick="sendQuickPrompt('Create a 7-day study plan for Physics Board Exams.')">
            <span>📅 Study Timetable</span>
            7-Day Physics Study Plan
          </button>
          <button class="feature-btn" onclick="sendQuickPrompt('Explain Calculus Integration step by step with examples.')">
            <span>💡 Solve Math Concept</span>
            Calculus Integration basics
          </button>
        </div>
      </div>

    </div>

    <!-- Input Bar -->
    <div class="input-area">
      <div class="input-container">
        <textarea id="userInput" placeholder="Ask AI Tutor anything..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">➔</button>
      </div>
    </div>
  </main>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const userInput = document.getElementById('userInput');
  const welcomeScreen = document.getElementById('welcomeScreen');

  function handleKeyPress(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendQuickPrompt(text) {
    userInput.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    // Hide welcome screen
    if (welcomeScreen) {
      welcomeScreen.style.display = 'none';
    }

    // Render User Message
    appendMessage(message, 'user');
    userInput.value = '';

    // Render Typing Indicator
    const typingId = showTyping();

    try {
      // Call Flask Backend Gemini API Route
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      removeTyping(typingId);

      if (data.status === 'success') {
        appendMessage(data.response, 'ai');
      } else {
        appendMessage("Error: " + (data.error || "Unable to get response."), 'ai');
      }
    } catch (err) {
      removeTyping(typingId);
      appendMessage("Network Error: Could not connect to backend server.", 'ai');
    }
  }

  function appendMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;

    const isAI = sender === 'ai';
    
    // Convert basic linebreaks and markdown bold text
    let formattedText = text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');

    msgDiv.innerHTML = `
      <div class="avatar ${sender}">${isAI ? '✦' : '👤'}</div>
      <div>
        <div class="message-content">${formattedText}</div>
        ${isAI ? `
          <div class="message-actions">
            <button class="action-icon" onclick="copyText(this)">📋 Copy</button>
            <button class="action-icon" onclick="speakText(this)">🔊 Listen</button>
          </div>
        ` : ''}
      </div>
    `;

    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    const id = 'typing-' + Date.now();
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message ai';
    typingDiv.id = id;
    typingDiv.innerHTML = `
      <div class="avatar ai">✦</div>
      <div class="message-content typing">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    `;
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function copyText(btn) {
    const text = btn.closest('.message').querySelector('.message-content').innerText;
    navigator.clipboard.writeText(text);
    btn.innerText = '✓ Copied';
    setTimeout(() => btn.innerText = '📋 Copy', 2000);
  }

  function speakText(btn) {
    const text = btn.closest('.message').querySelector('.message-content').innerText;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(utterance);
  }

  function startNewChat() {
    chatMessages.innerHTML = '';
    if (welcomeScreen) {
      chatMessages.appendChild(welcomeScreen);
      welcomeScreen.style.display = 'block';
    }
  }
</script>
</body>
</html>
